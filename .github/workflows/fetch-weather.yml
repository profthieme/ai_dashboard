name: Fetch Weather Data

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Fetch weather data from Ambient Weather
        env:
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_MAC_ADDRESS: ${{ secrets.AMBIENT_MAC_ADDRESS }}
        run: |
          # Build the API URL
          API_URL="https://api.ambientweather.net/v1/devices/${AMBIENT_MAC_ADDRESS}?apiKey=${AMBIENT_API_KEY}&limit=1"
          
          echo "Fetching weather data from: ${API_URL}"
          
          # Fetch the data with verbose output
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o weather_response.json "$API_URL")
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response size: $(wc -c < weather_response.json) bytes"
          
          # Show first 500 chars of response for debugging
          echo "Response preview:"
          head -c 500 weather_response.json
          echo ""
          
          # Check HTTP status
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error: API returned HTTP $HTTP_STATUS"
            echo "Check your API key and MAC address in GitHub secrets"
            exit 1
          fi
          
          # Check if we got valid data
          if [ ! -s weather_response.json ]; then
            echo "Error: No data received from API"
            exit 1
          fi
          
          # Extract the last reporter data (most recent)
          # Ambient Weather returns an array, we want the last element
          echo "Extracting weather data..."
          cat weather_response.json | jq '.[0].lastdata' > data/weather.json
          
          # Validate the output
          if [ ! -s data/weather.json ] || [ "$(cat data/weather.json)" = "null" ]; then
            echo "Error: Failed to extract weather data"
            echo "Full response:"
            cat weather_response.json | jq '.'
            exit 1
          fi
          
          echo "Successfully fetched weather data"
          cat data/weather.json | jq '.'
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/weather.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update weather data $(date '+%Y-%m-%d %H:%M')"
            git push
          fi