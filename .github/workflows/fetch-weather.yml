name: Fetch Weather Data

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Fetch weather data from Ambient Weather
        env:
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_MAC_ADDRESS: ${{ secrets.AMBIENT_MAC_ADDRESS }}
        run: |
          # Debug: Show secret lengths (not values)
          echo "API Key length: ${#AMBIENT_API_KEY}"
          echo "MAC Address length: ${#AMBIENT_MAC_ADDRESS}"
          echo "MAC Address: $AMBIENT_MAC_ADDRESS"
          
          # Try the alternative endpoint format for personal device access
          # This endpoint uses only apiKey for your own devices
          API_URL="https://api.ambientweather.net/v1/devices?applicationKey=${AMBIENT_API_KEY}"
          
          echo "Fetching device list from: ${API_URL}"
          
          # First, get the list of devices to find the correct MAC
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o device_list.json "$API_URL")
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response size: $(wc -c < device_list.json) bytes"
          
          echo "Device list preview:"
          cat device_list.json | jq '.' | head -30
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error: API returned HTTP $HTTP_STATUS"
            echo "You may need to request an applicationKey from support@ambientweather.com"
            exit 1
          fi
          
          # Extract data for our specific device
          echo "Extracting data for MAC: $AMBIENT_MAC_ADDRESS"
          cat device_list.json | jq --arg mac "$AMBIENT_MAC_ADDRESS" '.[] | select(.macAddress == $mac) | .lastData' > data/weather.json
          
          # Validate the output
          if [ ! -s data/weather.json ] || [ "$(cat data/weather.json)" = "null" ]; then
            echo "Error: No data found for MAC address $AMBIENT_MAC_ADDRESS"
            echo "Available devices:"
            cat device_list.json | jq '.[].macAddress'
            exit 1
          fi
          
          echo "Successfully fetched weather data"
          cat data/weather.json | jq '.'
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/weather.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update weather data $(date '+%Y-%m-%d %H:%M')"
            git push
          fi